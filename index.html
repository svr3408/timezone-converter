<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free online timezone converter. Pick a time in one zone and instantly see it in another.">
  <title>Timezone Converter</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="converter">
    <h1 class="converter__title">Timezone Converter</h1>

    <section class="converter__group">
      <label class="converter__label" for="source-zone">Your time</label>
      <div class="combobox">
        <input type="text" id="source-zone" class="combobox__input combobox__input--zone" list="zones" autocomplete="off"
               placeholder="Start typing a timezone…" aria-label="Source timezone" aria-describedby="source-error">
        <svg class="combobox__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>
      <p id="source-error" class="converter__error" role="alert"></p>
      <div class="converter__time-row">
        <div class="combobox">
          <input type="datetime-local" id="time-input" class="combobox__input" aria-label="Source time">
        </div>
        <button type="button" id="now-btn" class="button button--ghost">Now</button>
      </div>
    </section>

    <div class="converter__swap-row">
      <button type="button" id="swap-btn" class="button button--primary" aria-label="Swap timezones">
        <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>
        </svg>
        Swap
      </button>
    </div>

    <section class="converter__group">
      <label class="converter__label" for="target-zone">Target time</label>
      <div class="combobox">
        <input type="text" id="target-zone" class="combobox__input combobox__input--zone" list="zones" autocomplete="off"
               placeholder="Start typing a timezone…" aria-label="Target timezone" aria-describedby="target-error">
        <svg class="combobox__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>
      <p id="target-error" class="converter__error" role="alert"></p>
    </section>

    <section class="converter__result result" aria-live="polite" aria-label="Converted time">
      <p id="result-time" class="result__time">—</p>
      <p id="result-date" class="result__date"></p>
      <p id="result-offset" class="result__offset"></p>
    </section>

    <datalist id="zones"></datalist>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
